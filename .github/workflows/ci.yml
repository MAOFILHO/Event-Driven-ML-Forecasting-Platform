name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # PySpark is the project's ingest/ETL engine and needs a JVM. Spark 3.5.x
      # runs on Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # CPU-only torch wheel: the default PyPI wheel pulls ~4 GB of CUDA
      # packages and exhausts the runner disk. Tests do not need a GPU.
      - name: Install dependencies
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Spark ETL parity tests
        run: pytest tests/test_spark_etl.py -v

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      # Kafka producer/consumer transform logic is unit-tested against pure
      # functions and static batch DataFrames -- no live broker needed, so
      # these run in CI same as everything else. Full producer -> broker ->
      # consumer integration is a local-only manual verification step (see
      # README), not part of CI, consistent with the project's $0-cost /
      # no-external-services CI philosophy.
      - name: Run Kafka layer unit tests
        run: pytest tests/test_kafka_producer.py tests/test_kafka_consumer.py tests/test_streaming_endpoint.py -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
